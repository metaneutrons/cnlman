[workspace]
members = ["."]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Two windows-sys versions arrive through ureq -> rustls -> ring and are not
# ours to unify; the lint would otherwise fail every -D warnings run.
multiple_crate_versions = "allow"

[package]
name = "cnlman"
version.workspace = true
edition.workspace = true
description = "Click'n'Load receiver and decrypter for the command line, with pyLoad hand-off"
license = "GPL-3.0-or-later"
repository = "https://github.com/metaneutrons/cnlman"
readme = "README.md"
keywords = ["click-n-load", "cnl", "pyload", "jdownloader", "cli"]
categories = ["command-line-utilities"]
publish = false

[lints]
workspace = true

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
base64 = "0.23.1"
cbc = "0.2.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
form_urlencoded = "1.2.2"
hex = "0.4.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
thiserror = "2.0.21"
tiny_http = "0.12.0"
ureq = { version = "3.4.2", features = ["json"] }
