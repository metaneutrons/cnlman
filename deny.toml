# cargo-deny. Checks advisories, licences, duplicates and registries.
# Every entry under `ignore` needs a reason, the affected crate and the
# condition under which it is removed again.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# This list governs the dependencies. The project's **own** licence belongs in
# it as well, otherwise the check fails on the project's own crate:
# "GPL-3.0-or-later" for an application, "LGPL-3.0-or-later" for a library.
# A workspace holding both carries both entries.
allow = [
    # cnlman itself.
    "GPL-3.0-or-later",
    # webpki-roots: the Mozilla CA bundle that ureq's rustls trusts.
    "CDLA-Permissive-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
